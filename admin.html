<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whois 查询 - Domain Watch</title>
<style>
  /* ===== Swiss International 基础层 · 四页共用 · 修改需同步 ===== */
  :root {
    --black: #000000;
    --white: #ffffff;
    --red: #ff0000;
    --muted: #525252;
    --faint: #6b6b6b;
    --line: #cccccc;
    --wash: #f0f0f0;
    --sans: "Helvetica Neue", Helvetica, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    --nav-h: 76px;
  }
  * { box-sizing: border-box; }
  html { background: var(--white); }
  body { margin: 0; background: var(--white); color: var(--black); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; font-family: var(--sans); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  a { color: var(--black); }
  ::selection { background: var(--black); color: var(--white); }
  /* 标签：小号、大写、宽字距 */
  .label, .stat-label, th, .card-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .muted { color: var(--muted); }
  .ok { color: var(--black); }
  .warn { color: var(--black); }
  .err { color: var(--red); }
  .page { max-width: 1280px; margin: 0 auto; padding: calc(var(--nav-h) + 48px) 32px 80px; }
  /* 导航：白底黑字、细边框、方角 */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--white); border-bottom: 1px solid var(--black); }
  .topbar-inner { display: flex; align-items: stretch; justify-content: space-between; max-width: 1280px; margin: 0 auto; }
  .wordmark { display: flex; flex-direction: column; justify-content: center; padding: 14px 24px 14px 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--black); text-decoration: none; white-space: nowrap; }
  .wordmark span { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }
  .nav { display: flex; align-items: stretch; }
  .nav-link { display: inline-flex; align-items: center; gap: 6px; padding: 0 20px; border-left: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--black); background: none; text-decoration: none; cursor: pointer; transition: color 0.15s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out; }
  .nav-link:hover, .nav-link:focus-visible { color: var(--red); background: var(--wash); border-left-color: var(--red); }
  .nav-link::after { content: "\2192"; }
  /* 按钮：方角、粗体、纯不透明度过渡；箭头是排版的一部分 */
  .button { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border: 1px solid var(--black); border-radius: 0; background: var(--black); color: var(--white); font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: opacity 0.15s ease-out, color 0.15s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out; }
  .button::after { content: "\2192"; }
  .button:hover, .button:focus-visible { opacity: 0.8; }
  .button:active { opacity: 0.7; }
  .button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .button.secondary { background: var(--white); color: var(--black); }
  .button.secondary:hover, .button.secondary:focus-visible { background: var(--black); color: var(--white); }
  .button:disabled { opacity: 0.4; cursor: default; }
  /* 卡片：1px 黑边、白底、方角 */
  .card { border: 1px solid var(--black); border-radius: 0; background: var(--white); padding: 28px 32px; transition: border-color 0.15s ease-out, background-color 0.15s ease-out; }
  .card:hover { border-color: var(--red); }
  /* 引线延伸：左细线由灰变红，背景转浅灰——网格被激活，而不是被装饰 */
  .row-line { border-left: 1px solid var(--line); padding-left: 20px; transition: border-color 0.15s ease-out, background-color 0.15s ease-out; }
  .row-line:hover { border-left-color: var(--red); background: var(--wash); }
  .row-line .row-title { font-weight: 700; letter-spacing: -0.01em; transition: color 0.15s ease-out; }
  .row-line:hover .row-title, .row-line:hover .row-label { color: var(--red); }
  /* 输入：1px 黑边、方角、无衬线 */
  input[type=text], input[type=password], input[type=number], textarea, select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--black); border-radius: 0; background: var(--white); color: var(--black); font-family: var(--sans); font-size: 15px; line-height: 1.5; outline: none; transition: border-color 0.15s ease-out; }
  textarea { min-height: 132px; resize: vertical; font-size: 14px; line-height: 1.6; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, textarea:focus, select:focus { border-color: var(--red); }
  input[type=number]:focus, textarea:focus { border-color: var(--red); }
  .check { display: flex; align-items: center; gap: 10px; margin: 20px 0 0; font-size: 13px; letter-spacing: 0.04em; color: var(--muted); }
  .check input { width: 15px; height: 15px; min-height: 0; accent-color: var(--black); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; }
  /* 段落级提示：离标题远（20px），离所属表单保持 24px；紧邻的下一段还有提示时，
     两段之间拉近到 8px，让它们读起来是一组，而不是各自独立的两行灰字。 */
  .hint { margin: 20px 0 24px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .hint:has(+ .hint) { margin-bottom: 8px; }
  .hint + .hint { margin-top: 0; }
  /* 字段级提示（在 .grid 内）贴着自己的输入框，不吃段落级那份标题间距 */
  .grid .hint { margin: 4px 0 24px; }
  .hint code { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .actions { display: flex; gap: 12px; flex-wrap: nowrap; margin-top: 28px; }
  /* 表格：黑线、无斑马纹 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 700; border-bottom: 2px solid var(--black); }
  td { border-top: 1px solid var(--line); vertical-align: top; }
  /* 状态块：方角细边，无阴影 */
  .pill { display: inline-block; padding: 3px 9px; border: 1px solid var(--black); border-radius: 0; background: var(--white); color: var(--black); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .pill.err { border-color: var(--red); color: var(--red); }
  .pill.warn { background: var(--black); color: var(--white); }
  .toasts { position: fixed; top: 20px; right: 20px; z-index: 60; display: flex; flex-direction: column; gap: 12px; width: min(400px, calc(100vw - 40px)); pointer-events: none; }
  .toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid var(--black); background: var(--white); color: var(--black); font-size: 14px; line-height: 1.6; animation: cut-in 0.15s ease-out both; }
  .toast.err { border-color: var(--red); }
  .toast .toast-icon { flex: none; font-weight: 700; }
  .toast.err .toast-icon { color: var(--red); }
  .toast .toast-text { flex: 1; word-break: break-word; }
  .toast .toast-close { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: none; color: var(--faint); font-family: var(--sans); font-size: 16px; line-height: 1; cursor: pointer; }
  .toast .toast-close:hover { color: var(--red); }
  @keyframes cut-in { from { opacity: 0; } to { opacity: 1; } }
  .link-btn { padding: 0; border: 0; background: none; color: var(--black); font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: color 0.15s ease-out; }
  .link-btn:hover, .link-btn:focus-visible { color: var(--red); }
  .link-btn:disabled { opacity: 0.4; cursor: default; }
  .hidden { display: none; }
  footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 72px; padding: 20px 0 0; border-top: 1px solid var(--black); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  @media (max-width: 860px) {
    .page { padding: 32px 20px 56px; }
    .actions { flex-wrap: wrap; }
    .topbar { position: static; }
    .topbar-inner { flex-direction: column; }
    .nav { flex-wrap: wrap; border-top: 1px solid var(--line); }
    .nav-link { border-left: 0; border-top: 1px solid var(--line); padding: 12px 16px 12px 0; margin-right: 16px; }
    .card { padding: 20px; }
    footer { flex-direction: column; gap: 10px; margin-top: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  /* ===== 查询页专属 ===== */
  .hero { display: grid; grid-template-columns: 7fr 5fr; gap: 48px; align-items: end; padding: 40px 0 0; border-bottom: 2px solid var(--black); }
  h1 { font-size: clamp(44px, 8vw, 104px); }
  .hero .lede { margin: 0; padding-bottom: 10px; font-size: 17px; line-height: 1.7; color: var(--muted); }
  .query { margin-top: 64px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .section-head h2 { font-size: 30px; }
  .search { display: flex; align-items: stretch; gap: 16px; }
  .search input { flex: 1; min-width: 0; min-height: 52px; font-size: 19px; }
  .search .button { flex: 0 0 auto; min-width: 132px; }
  .search-note { margin: 12px 0 0; font-size: 13px; color: var(--faint); }
  #status { min-height: 26px; margin-top: 28px; font-size: 14px; }
  #status.error { color: var(--red); }
  #result { display: grid; gap: 24px; margin-top: 28px; }
  .card h3 { font-size: 20px; margin-bottom: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--black); }
  table { font-size: 15px; }
  td { padding: 12px 0; }
  td:first-child { width: 30%; padding-right: 28px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  td a { color: var(--black); text-decoration: underline; text-underline-offset: 3px; transition: color 0.15s ease-out; }
  td a:hover { color: var(--red); }
  .value { overflow-wrap: anywhere; }
  .raw-toggle { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: color 0.15s ease-out; }
  .raw-toggle::after { content: " \2192"; }
  .raw-toggle:hover, .raw-toggle:focus-visible { color: var(--red); }
  pre { max-height: 440px; margin: 20px 0 0; padding: 20px; overflow: auto; border: 1px solid var(--black); background: var(--white); color: var(--black); font-family: var(--sans); font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 20px; } .query { margin-top: 40px; } .search { flex-direction: column; } .search .button { width: 100%; } td:first-child { width: 40%; padding-right: 14px; } }
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="/">Domain Watch<span>Whois / RDAP</span></a>
      <nav class="nav">
        <a class="nav-link" href="/monitor">监控面板</a>
        <a class="nav-link" id="adminLink" href="/login">管理员</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>查一个域名</h1>
    <p class="lede">读出域名的注册时间、到期时间、注册商与命名系统记录。数据来自注册局的 RDAP，缺失时回退 WHOIS。</p>
  </section>

  <section class="query" aria-labelledby="queryTitle">
    <div class="section-head"><h2 id="queryTitle">域名查询</h2><span class="label">Specimen 001</span></div>
    <form class="search" id="searchForm">
      <input type="text" id="domain" placeholder="example.com" aria-label="域名" autocomplete="off">
      <button class="button" id="btn" type="submit">查询</button>
    </form>
    <p class="search-note">支持中文域名、完整 URL 与带端口的输入。</p>
    <div id="status" aria-live="polite"></div>
    <div id="result" class="hidden"></div>
  </section>

  <footer><span>Domain Watch</span><span>Whois / RDAP</span></footer>
</main>

<script>
"use strict";
const input = document.getElementById("domain");
const btn = document.getElementById("btn");
const form = document.getElementById("searchForm");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const adminLink = document.getElementById("adminLink");
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fmtDate(v) { if (!v) return "—"; const d = new Date(v); if (isNaN(d.getTime())) return esc(v); return d.toLocaleString("zh-CN", { timeZone: "UTC", hour12: false }) + " UTC"; }
function kv(label, value) { return '<tr><td>' + esc(label) + '</td><td class="value">' + (value === null || value === undefined || value === "" ? "—" : value) + "</td></tr>"; }
function render(d) {
  const status = (d.status || []).map(function (s) { return '<span class="pill">' + esc(s) + "</span>"; }).join("");
  const ns = (d.nameservers || []).map(function (n) { return esc(n); }).join("<br>");
  const ds = d.dnssec && Array.isArray(d.dnssec.dsData) ? d.dnssec.dsData.map(function (x) { return "keyTag " + x.keyTag + " · algo " + x.algorithm + " · digest " + String(x.digest).slice(0, 24) + "…"; }).join("<br>") : (d.dnssec && d.dnssec.delegationSigned ? "已签名" : "未签名");
  resultEl.innerHTML =
    '<section class="card row-line"><h3>基本信息</h3><table>' + kv("域名", esc(d.domain || d.asciiDomain)) + kv("ASCII 形式", d.asciiDomain ? esc(d.asciiDomain) : null) + kv("TLD", d.tld ? esc(d.tld) : null) + kv("注册时间", fmtDate(d.registration)) + kv("到期时间", fmtDate(d.expiration)) + kv("最近变更", fmtDate(d.lastChanged)) + kv("RDAP 服务器", d.rdapServer ? '<a href="' + esc(d.rdapServer) + '" target="_blank" rel="noopener">' + esc(d.rdapServer) + "</a>" : null) + kv("数据来源", d.source === "whois" ? "WHOIS 回退（" + esc(d.whoisServer || "") + "）" : "RDAP") + "</table></section>" +
    '<section class="card row-line"><h3>注册商</h3><table>' + kv("名称", d.registrar && d.registrar.name ? esc(d.registrar.name) : null) + kv("IANA ID", d.registrar && d.registrar.handle ? esc(d.registrar.handle) : null) + "</table></section>" +
    '<section class="card row-line"><h3>Nameservers</h3><div class="value">' + (ns || "—") + "</div></section>" +
    '<section class="card row-line"><h3>状态码</h3><div class="value">' + (status || "—") + "</div></section>" +
    '<section class="card row-line"><h3>DNSSEC</h3><div class="value">' + ds + "</div></section>" +
    '<section class="card row-line"><h3>原始 RDAP JSON</h3><div class="raw-toggle" id="toggleRaw" role="button" tabindex="0">展开 / 收起</div><pre id="rawJson" class="hidden">' + esc(JSON.stringify(d, null, 2)) + "</pre></section>";
  const toggle = document.getElementById("toggleRaw"); const raw = document.getElementById("rawJson");
  function toggleRaw() { raw.classList.toggle("hidden"); }
  toggle.addEventListener("click", toggleRaw); toggle.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleRaw(); } });
  resultEl.classList.remove("hidden");
}
async function query(e) { if (e) e.preventDefault(); const domain = input.value.trim(); if (!domain) { statusEl.className = "error"; statusEl.textContent = "请输入域名"; return; } btn.disabled = true; statusEl.className = ""; statusEl.textContent = "查询中…"; try { const resp = await fetch("/api/whois?domain=" + encodeURIComponent(domain), { headers: { Accept: "application/json" } }); if (resp.status === 401) { location.href = "/login?next=/"; return; } const data = await resp.json(); if (data.ok) { statusEl.textContent = "查询成功"; render(data); } else { statusEl.className = "error"; statusEl.textContent = "查询失败：" + ((data.error && data.error.message) || "未知错误"); resultEl.classList.add("hidden"); } } catch (err) { statusEl.className = "error"; statusEl.textContent = "请求失败：" + String(err && err.message || err); resultEl.classList.add("hidden"); } finally { btn.disabled = false; } }
form.addEventListener("submit", query); input.focus();
fetch("/api/auth/me").then(function (r) { if (r.ok) { adminLink.href = "/settings"; adminLink.textContent = "设置"; } }).catch(function () {});
</script>
</body>
</html>
