<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>域名监控 - Domain Watch</title>
<style>
  /* ===== Swiss International 基础层 · 四页共用 · 修改需同步 ===== */
  :root {
    --black: #000000;
    --white: #ffffff;
    --red: #ff0000;
    --muted: #525252;
    --faint: #6b6b6b;
    --line: #cccccc;
    --wash: #f0f0f0;
    --sans: "Helvetica Neue", Helvetica, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    --nav-h: 76px;
  }
  * { box-sizing: border-box; }
  html { background: var(--white); }
  body { margin: 0; background: var(--white); color: var(--black); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; font-family: var(--sans); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  a { color: var(--black); }
  ::selection { background: var(--black); color: var(--white); }
  /* 标签：小号、大写、宽字距 */
  .label, .stat-label, th, .card-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .muted { color: var(--muted); }
  .ok { color: var(--black); }
  .warn { color: var(--black); }
  .err { color: var(--red); }
  .page { max-width: 1280px; margin: 0 auto; padding: calc(var(--nav-h) + 48px) 32px 80px; }
  /* 导航：白底黑字、细边框、方角 */
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--white); border-bottom: 1px solid var(--black); }
  .topbar-inner { display: flex; align-items: stretch; justify-content: space-between; max-width: 1280px; margin: 0 auto; }
  .wordmark { display: flex; flex-direction: column; justify-content: center; padding: 14px 24px 14px 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; color: var(--black); text-decoration: none; white-space: nowrap; }
  .wordmark span { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }
  .nav { display: flex; align-items: stretch; }
  .nav-link { display: inline-flex; align-items: center; gap: 6px; padding: 0 20px; border-left: 1px solid var(--line); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--black); background: none; text-decoration: none; cursor: pointer; transition: color 0.15s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out; }
  .nav-link:hover, .nav-link:focus-visible { color: var(--red); background: var(--wash); border-left-color: var(--red); }
  .nav-link::after { content: "\2192"; }
  /* 按钮：方角、粗体、纯不透明度过渡；箭头是排版的一部分 */
  .button { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border: 1px solid var(--black); border-radius: 0; background: var(--black); color: var(--white); font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: opacity 0.15s ease-out, color 0.15s ease-out, background-color 0.15s ease-out, border-color 0.15s ease-out; }
  .button::after { content: "\2192"; }
  .button:hover, .button:focus-visible { opacity: 0.8; }
  .button:active { opacity: 0.7; }
  .button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .button.secondary { background: var(--white); color: var(--black); }
  .button.secondary:hover, .button.secondary:focus-visible { background: var(--black); color: var(--white); }
  .button:disabled { opacity: 0.4; cursor: default; }
  /* 卡片：1px 黑边、白底、方角 */
  .card { border: 1px solid var(--black); border-radius: 0; background: var(--white); padding: 28px 32px; transition: border-color 0.15s ease-out, background-color 0.15s ease-out; }
  .card:hover { border-color: var(--red); }
  /* 引线延伸：左细线由灰变红，背景转浅灰——网格被激活，而不是被装饰 */
  .row-line { border-left: 1px solid var(--line); padding-left: 20px; transition: border-color 0.15s ease-out, background-color 0.15s ease-out; }
  .row-line:hover { border-left-color: var(--red); background: var(--wash); }
  .row-line .row-title { font-weight: 700; letter-spacing: -0.01em; transition: color 0.15s ease-out; }
  .row-line:hover .row-title, .row-line:hover .row-label { color: var(--red); }
  /* 输入：1px 黑边、方角、无衬线 */
  input[type=text], input[type=password], input[type=number], textarea, select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--black); border-radius: 0; background: var(--white); color: var(--black); font-family: var(--sans); font-size: 15px; line-height: 1.5; outline: none; transition: border-color 0.15s ease-out; }
  textarea { min-height: 132px; resize: vertical; font-size: 14px; line-height: 1.6; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:focus, textarea:focus, select:focus { border-color: var(--red); }
  input[type=number]:focus, textarea:focus { border-color: var(--red); }
  .check { display: flex; align-items: center; gap: 10px; margin: 20px 0 0; font-size: 13px; letter-spacing: 0.04em; color: var(--muted); }
  .check input { width: 15px; height: 15px; min-height: 0; accent-color: var(--black); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; }
  /* 段落级提示：离标题远（20px），离所属表单保持 24px；紧邻的下一段还有提示时，
     两段之间拉近到 8px，让它们读起来是一组，而不是各自独立的两行灰字。 */
  .hint { margin: 20px 0 24px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .hint:has(+ .hint) { margin-bottom: 8px; }
  .hint + .hint { margin-top: 0; }
  /* 字段级提示（在 .grid 内）贴着自己的输入框，不吃段落级那份标题间距 */
  .grid .hint { margin: 4px 0 24px; }
  .hint code { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .actions { display: flex; gap: 12px; flex-wrap: nowrap; margin-top: 28px; }
  /* 表格：黑线、无斑马纹 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 700; border-bottom: 2px solid var(--black); }
  td { border-top: 1px solid var(--line); vertical-align: top; }
  /* 状态块：方角细边，无阴影 */
  /* 状态列：固定 88px 方框、文字居中，避免长短不一导致列宽参差 */
  th.status, td.status { width: 88px; text-align: center; }
  td.status .pill { display: inline-flex; align-items: center; justify-content: center; width: 88px; min-height: 24px; padding: 0 6px; white-space: nowrap; }
  .pill { display: inline-block; padding: 3px 9px; border: 1px solid var(--black); border-radius: 0; background: var(--white); color: var(--black); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .pill.err { border-color: var(--red); color: var(--red); }
  .pill.warn { background: var(--black); color: var(--white); }
  .toasts { position: fixed; top: 20px; right: 20px; z-index: 60; display: flex; flex-direction: column; gap: 12px; width: min(400px, calc(100vw - 40px)); pointer-events: none; }
  .toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid var(--black); background: var(--white); color: var(--black); font-size: 14px; line-height: 1.6; animation: cut-in 0.15s ease-out both; }
  .toast.err { border-color: var(--red); }
  .toast .toast-icon { flex: none; font-weight: 700; }
  .toast.err .toast-icon { color: var(--red); }
  .toast .toast-text { flex: 1; word-break: break-word; }
  .toast .toast-close { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: none; color: var(--faint); font-family: var(--sans); font-size: 16px; line-height: 1; cursor: pointer; }
  .toast .toast-close:hover { color: var(--red); }
  @keyframes cut-in { from { opacity: 0; } to { opacity: 1; } }
  .link-btn { padding: 0; border: 0; background: none; color: var(--black); font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: color 0.15s ease-out; }
  .link-btn:hover, .link-btn:focus-visible { color: var(--red); }
  .link-btn:disabled { opacity: 0.4; cursor: default; }
  .hidden { display: none; }
  footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 72px; padding: 20px 0 0; border-top: 1px solid var(--black); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  @media (max-width: 860px) {
    .page { padding: 32px 20px 56px; }
    .actions { flex-wrap: wrap; }
    .topbar { position: static; }
    .topbar-inner { flex-direction: column; }
    .nav { flex-wrap: wrap; border-top: 1px solid var(--line); }
    .nav-link { border-left: 0; border-top: 1px solid var(--line); padding: 12px 16px 12px 0; margin-right: 16px; }
    .card { padding: 20px; }
    footer { flex-direction: column; gap: 10px; margin-top: 48px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  /* ===== 监控页专属 ===== */
  h1 { font-size: clamp(38px, 6vw, 76px); }
  .sub { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
  #message { min-height: 24px; margin: 24px 0 0; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 40px 0 0; border-top: 1px solid var(--black); border-bottom: 1px solid var(--black); }
  .stat { padding: 20px 24px; border-left: 1px solid var(--line); transition: border-color 0.15s ease-out, background-color 0.15s ease-out; }
  .stat:first-child { border-left: 0; padding-left: 0; }
  .stat:hover { border-left-color: var(--red); background: var(--wash); }
  .stat-value { margin-top: 6px; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .card { margin-top: 40px; padding: 0; }
  .config-line { margin: 0 32px 20px; font-size: 13px; }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 24px 32px 12px; }
  h2 { font-size: 24px; }
  .add-form { display: flex; align-items: stretch; gap: 16px; flex-wrap: wrap; padding: 0 32px 24px; }
  .add-form input { flex: 1 1 260px; min-width: 0; }
  .table-wrap { overflow-x: auto; padding: 0 32px 28px; }
  table { min-width: 1120px; font-size: 14px; }
  th, td { padding: 12px 16px 12px 0; }
  tbody tr { transition: background-color 0.15s ease-out; }
  tbody tr:hover td { background: var(--wash); }
  tbody tr.row-line td:first-child { border-left: 1px solid var(--line); padding-left: 14px; transition: border-color 0.15s ease-out, color 0.15s ease-out; }
  tbody tr.row-line:hover td:first-child { border-left-color: var(--red); }
  tbody tr.row-line:hover td:first-child b { color: var(--red); }
  .empty { padding: 40px 32px; color: var(--muted); }
  .empty a { color: var(--black); text-decoration: underline; text-underline-offset: 3px; }
  .meta-edit-row td { background: var(--wash); padding: 20px 0; }
  .meta-form { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .meta-form > div { flex: 1 1 180px; min-width: 0; }
  .meta-form label { display: block; margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .meta-form input { min-height: 40px; }
  .meta-actions { flex: 0 0 auto; display: flex; gap: 10px; }
  .meta-actions .button { padding: 10px 16px; font-size: 11px; }
  @media (max-width: 860px) { .card-top, .add-form, .table-wrap, .empty { padding-left: 20px; padding-right: 20px; } .stat, .stat:first-child { border-left: 0; padding-left: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="/">Domain Watch<span>Field monitor</span></a>
      <nav class="nav">
        <a class="nav-link" href="/">域名查询</a>
        <a class="nav-link" href="/settings">设置</a>
        <button class="nav-link" id="refresh" type="button">刷新</button>
        <button class="nav-link" id="check" type="button">立即检查</button>
        <button class="nav-link" id="test" type="button">测试通知</button>
        <button class="nav-link" id="logout" type="button">退出</button>
      </nav>
    </div>
  </header>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <h1>域名监控</h1>
  <p class="sub">到期状态、提醒记录与 Telegram 通知。</p>
  <div id="message" aria-live="polite"></div>
  <section class="stats" aria-label="监控概览">
    <div class="stat"><div class="stat-label">监控域名</div><div class="stat-value" id="total">—</div></div>
    <div class="stat"><div class="stat-label">正常</div><div class="stat-value ok" id="normal">—</div></div>
    <div class="stat"><div class="stat-label">即将到期</div><div class="stat-value warn" id="expiring">—</div></div>
    <div class="stat"><div class="stat-label">已过期</div><div class="stat-value err" id="expired">—</div></div>
    <div class="stat"><div class="stat-label">Telegram</div><div class="stat-value" id="telegram">—</div></div>
  </section>
  <section class="card">
    <div class="card-top"><h2>监控列表</h2><div class="muted" id="updated">尚未刷新</div></div>
    <p class="hint config-line" id="configLine"></p>
    <form class="add-form" id="addForm">
      <input id="addInput" type="text" placeholder="输入要添加的域名，例如 example.com" aria-label="要添加的域名" autocomplete="off" spellcheck="false">
      <button class="button" type="submit" id="addButton">添加域名</button>
    </form>
    <div class="table-wrap"><div id="content" class="empty">正在加载…</div></div>
  </section>
  <footer><span>Domain Watch</span><span>每 60 秒自动刷新</span></footer>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TOAST_MS = 4200;
function toast(text, kind = "ok") {
  const host = $("toasts"); if (!host) return;
  const bad = kind === "err";
  const item = document.createElement("div"); item.className = "toast" + (bad ? " err" : "");
  const icon = document.createElement("span"); icon.className = "toast-icon"; icon.textContent = bad ? "\u2715" : "\u2713";
  const body = document.createElement("span"); body.className = "toast-text"; body.textContent = text;
  const close = document.createElement("button"); close.type = "button"; close.className = "toast-close";
  close.setAttribute("aria-label", "关闭提示"); close.textContent = "\u00d7";
  item.append(icon, body, close); host.appendChild(item);
  const remove = () => { item.style.opacity = "0"; item.style.transform = "translateY(-6px)"; setTimeout(() => item.remove(), 200); };
  const timer = setTimeout(remove, TOAST_MS);
  item.addEventListener("mouseenter", () => clearTimeout(timer));
  close.addEventListener("click", () => { clearTimeout(timer); item.remove(); });
  return item;
}
const ok = (text) => toast(text, "ok");
const fail = (action, error) => toast(action + "失败：" + ((error && error.message) || "未知错误"), "err");
let lastItems = [];
const stateNames = { ok:"正常", expiring:"即将到期", expired:"已过期", unknown:"信息不完整", failed:"查询失败" };
const stateClasses = { ok:"ok", expiring:"warn", expired:"err", unknown:"", failed:"err" };
function esc(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function setMessage(text, kind) { $("message").innerHTML = text ? `<span class="${esc(kind || "")}">${esc(text)}</span>` : ""; }
/** 只接受 http(s)，防止手改 settings.json 塞进 javascript: 链接 */
function safeUrl(url) {
  try { const u = new URL(String(url || "")); return (u.protocol === "http:" || u.protocol === "https:") ? u : null; }
  catch { return null; }
}
function metaHost(url) { const u = safeUrl(url); return u ? u.hostname.replace(/^www\./, "") : ""; }
/** 续费价格 / 商家 / 商家网站三列；商家留空时用注册局返回的注册商名兜底 */
function metaCells(item) {
  const price = esc(item.price || "—");
  const vendor = esc(item.vendor || item.registrarName || "—");
  const safe = safeUrl(item.vendorUrl);
  const link = safe
    ? `<a href="${esc(safe.toString())}" target="_blank" rel="noopener noreferrer">${esc(safe.hostname.replace(/^www\./, ""))}</a>`
    : '<span class="muted">—</span>';
  return `<td>${price}</td><td>${vendor}</td><td>${link}</td>`;
}
function daysText(item) { if (item.daysLeft === null || item.daysLeft === undefined) return "—"; if (item.daysLeft < 0) return `已过期 ${Math.abs(item.daysLeft)} 天`; if (item.daysLeft === 0) return "今天到期"; return `剩余 ${item.daysLeft} 天`; }
function render(data) { const s=data.summary||{}; $("total").textContent=s.total??0; $("normal").textContent=s.ok??0; $("expiring").textContent=s.expiring??0; $("expired").textContent=s.expired??0; $("telegram").textContent=data.telegramConfigured?"已配置":"未配置"; $("telegram").className="stat-value "+(data.telegramConfigured?"ok":"warn"); $("updated").textContent=data.checkedAt?"最后刷新："+new Date(data.checkedAt).toLocaleString("zh-CN"):"尚未刷新"; $("configLine").textContent=`配置来源：${data.configSource==="panel"?"设置面板":".env 文件"}　·　每日检查 ${data.checkTime||"—"}　·　提醒窗口 ${data.remindDays??"—"} 天`; const items=data.items||[]; lastItems=items; if(!items.length){$("content").className="empty";$("content").innerHTML='没有配置监控域名，请到 <a href="/settings">设置页面</a> 填写。';return;} $("content").className=""; $("content").innerHTML="<table><thead><tr><th>域名</th><th class=\"status\">状态</th><th>到期时间</th><th>剩余时间</th><th>来源</th><th>续费价格</th><th>商家</th><th>商家网站</th><th>最近提醒</th><th>操作</th></tr></thead><tbody>"+items.map(item=>{if(!item.ok)return `<tr class="row-line" data-domain="${esc(item.domain)}"><td><b>${esc(item.domain)}</b></td><td class=\"status\"><span class="pill err">${esc(stateNames.failed)}</span></td><td colspan="4" class="err">${esc(item.error?.message||"查询失败")}</td>${metaCells(item)}<td><button class="link-btn" data-edit="${esc(item.domain)}" type="button">编辑</button> <button class="link-btn" data-remove="${esc(item.domain)}" type="button">移除</button></td></tr>`;const reminded=item.remindedAt?new Date(item.remindedAt).toLocaleString("zh-CN"):"—";return `<tr class="row-line" data-domain="${esc(item.domain)}"><td><b>${esc(item.domain)}</b></td><td class=\"status\"><span class="pill ${esc(stateClasses[item.state]||"")}">${esc(stateNames[item.state]||item.state)}</span></td><td>${esc(item.expirationDate||"—")}</td><td>${esc(daysText(item))}</td><td>${esc(item.source||"—")}</td>${metaCells(item)}<td class="muted">${esc(reminded)}</td><td><button class="link-btn" data-edit="${esc(item.domain)}" type="button">编辑</button> <button class="link-btn" data-remove="${esc(item.domain)}" type="button">移除</button></td></tr>`;}).join("")+"</tbody></table>"; }
async function load() { $("refresh").disabled=true; try { const response=await fetch("/api/monitor",{headers:{Accept:"application/json"}}); if(response.status===401){location.href="/login?next=/monitor";return;} const data=await response.json(); if(!response.ok||data.ok===false&&data.error)throw new Error(data.error.message||"加载失败"); render(data); setMessage(""); } catch(error) { $("content").className="empty err"; $("content").textContent="加载失败："+error.message; fail("加载监控数据",new Error(error.message)); } finally { $("refresh").disabled=false; } }
async function post(path,label) { const button=path.includes("check")?$("check"):$("test"); button.disabled=true; try { const response=await fetch(path,{method:"POST"}); if(response.status===401){location.href="/login?next=/monitor";return;} const data=await response.json(); if(!response.ok||data.ok===false)throw new Error(data.error?.message||data.message||"操作失败"); setMessage(label+"成功","ok"); await load(); } catch(error) { setMessage(label+"失败："+error.message,"err"); } finally { button.disabled=false; } }
$("refresh").addEventListener("click",load); $("check").addEventListener("click",()=>post("/api/check","立即检查")); $("test").addEventListener("click",()=>post("/api/test-notify","Telegram 测试通知")); async function changeDomains(body) {
  const response = await fetch("/api/settings/monitor/domains", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (response.status === 401) { location.href = "/login?next=/monitor"; return; }
  const data = await response.json();
  if (!response.ok || !data.ok) throw new Error(data.error?.message || "操作失败");
  ok(data.message);
  setMessage("");
  await load();
}
$("addForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = $("addInput");
  const value = input.value.trim();
  if (!value) { fail("添加域名", new Error("请先输入域名")); return; }
  const button = $("addButton");
  button.disabled = true;
  try { await changeDomains({ add: value }); input.value = ""; }
  catch (error) { fail("添加域名", error); }
  finally { button.disabled = false; }
});
function closeEditRows() {
  for (const row of $("content").querySelectorAll("tr.meta-edit-row")) row.remove();
}
/** 在目标行后面插入一行备注编辑表单 */
function openEditRow(domain) {
  closeEditRows();
  const item = (lastItems || []).find((entry) => entry.domain === domain);
  if (!item) return;
  const row = document.createElement("tr");
  row.className = "meta-edit-row row-line";
  const vendorHost = item.vendorUrl ? metaHost(item.vendorUrl) : "";
  row.innerHTML = `<td colspan="10"><div class="meta-form">
    <div><label for="m-price-${esc(domain)}">续费价格</label><input id="m-price-${esc(domain)}" type="text" placeholder="例如 ¥85 / 年" value="${esc(item.price || "")}"></div>
    <div><label for="m-vendor-${esc(domain)}">商家</label><input id="m-vendor-${esc(domain)}" type="text" placeholder="留空则显示注册商名" value="${esc(item.vendor || "")}"></div>
    <div><label for="m-url-${esc(domain)}">商家网站</label><input id="m-url-${esc(domain)}" type="text" placeholder="例如 dash.cloudflare.com" value="${esc(vendorHost)}"></div>
    <div class="meta-actions"><button class="button" data-save="${esc(domain)}" type="button">保存</button><button class="button secondary" data-cancel="1" type="button">取消</button></div>
  </div></td>`;
  const anchor = $("content").querySelector(`tr[data-domain="${CSS.escape(domain)}"]`);
  if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(row, anchor.nextSibling);
}
async function saveMeta(domain) {
  const price = ($(`m-price-${domain}`) || {}).value || "";
  const vendor = ($(`m-vendor-${domain}`) || {}).value || "";
  const vendorUrl = ($(`m-url-${domain}`) || {}).value || "";
  const response = await fetch("/api/settings/domain-meta", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ set: { [domain]: { price, vendor, vendorUrl } } }),
  });
  if (response.status === 401) { location.href = "/login?next=/monitor"; return; }
  const data = await response.json();
  if (!response.ok || !data.ok) throw new Error(data.error?.message || "保存失败");
  ok(data.message);
  closeEditRows();
  await load();
}
$("content").addEventListener("click", async (event) => {
  const edit = event.target.closest("[data-edit]");
  if (edit) { openEditRow(edit.getAttribute("data-edit")); return; }
  const cancel = event.target.closest("[data-cancel]");
  if (cancel) { closeEditRows(); return; }
  const save = event.target.closest("[data-save]");
  if (save) {
    const domain = save.getAttribute("data-save");
    save.disabled = true;
    try { await saveMeta(domain); }
    catch (error) { save.disabled = false; fail("保存域名备注", error); }
    return;
  }
  const target = event.target.closest("[data-remove]");
  if (!target) return;
  const domain = target.getAttribute("data-remove");
  if (!confirm("确定不再监控 " + domain + "？")) return;
  target.disabled = true;
  try { await changeDomains({ remove: domain }); }
  catch (error) { target.disabled = false; fail("移除域名", error); }
});
$("logout").addEventListener("click",async()=>{await fetch("/api/auth/logout",{method:"POST"});location.href="/login";}); load(); setInterval(load,60000);
</script>
